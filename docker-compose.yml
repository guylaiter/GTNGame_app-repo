version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: guess_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  backend:
    build: ./backend
    container_name: guess_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_NUMBER: ${SECRET_NUMBER} # <-- Secret / .env =  your secret number!
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
      - frontend_network

  frontend:
    image: nginx:alpine
    container_name: guess_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontend_network


networks:
  backend_network:
    driver: bridge
  frontend_network:
    driver: bridge

volumes:
  pgdata:
