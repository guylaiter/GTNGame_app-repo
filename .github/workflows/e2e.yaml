name: E2E Tests

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, staging]

permissions:
  id-token: write
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
      
      - name: Install E2E test dependencies
        run: pip install pytest requests
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Get image tag from CI workflow
        id: get-tag
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Debug branch + condition
        run: |
          echo "head_branch = ${{ github.event.workflow_run.head_branch }}"
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "Condition evaluated to TRUE (using secrets)"
          else
            echo "Condition evaluated to FALSE (using fallback test values)"
          fi
      
      - name: Pull and start container with docker compose
        env:
          BACKEND_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:${{ steps.get-tag.outputs.IMAGE_TAG }}
          POSTGRES_USER: ${{ github.event.workflow_run.head_branch == 'main' && secrets.E2E_POSTGRES_USER || 'testuser' }}
          POSTGRES_PASSWORD: ${{ github.event.workflow_run.head_branch == 'main' && secrets.E2E_POSTGRES_PASSWORD || 'testpass' }}
          POSTGRES_DB: ${{ github.event.workflow_run.head_branch == 'main' && secrets.E2E_POSTGRES_DB || 'testdb' }}
          DATABASE_URL: ${{ github.event.workflow_run.head_branch == 'main' && secrets.E2E_DATABASE_URL || 'postgresql://testuser:testpass@db:5432/testdb' }}
          SECRET_NUMBER: ${{ github.event.workflow_run.head_branch == 'main' && secrets.E2E_SECRET_NUMBER || '33' }}
        run: |
          docker pull $BACKEND_IMAGE
      
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> .env
          echo "POSTGRES_USER=$POSTGRES_USER" >> .env
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
          echo "POSTGRES_DB=$POSTGRES_DB" >> .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "SECRET_NUMBER=$SECRET_NUMBER" >> .env
      
          docker compose up -d

      - name: Show container logs for debugging
        if: always()
        run: |
          echo "=== Backend logs ==="
          docker compose logs backend
          echo "=== DB logs ==="
          docker compose logs db
          echo "=== Container status ==="
          docker compose ps
          
      
      - name: Wait for application
        run: |
          timeout 15 sh -c 'until curl -f http://localhost/api/health 2>/dev/null; do sleep 1; done' || {
            echo "❌ Application failed to start"
            docker compose logs
            exit 1
          }
          echo "✅ Application is ready"
      
      - name: Run E2E tests
        run: |
          cd backend
          pytest tests/e2e_tests/ -v --tb=short
      
      - name: E2E Test Summary
        if: success()
        run: |
          echo "✅ E2E Tests Passed Successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Image tested: ${{ steps.get-tag.outputs.IMAGE_TAG }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
